<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Finanzas</title>
<style>
:root{
  color-scheme: light;
  --plane:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --border:rgba(11,11,11,.10); --s1:#2a78d6; --s3:#1baf7a;
  --shadow:0 1px 2px rgba(11,11,11,.04),0 8px 28px rgba(11,11,11,.06);
}
@media (prefers-color-scheme: dark){:root{
  color-scheme: dark;
  --plane:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink2:#c3c2b7; --muted:#898781;
  --border:rgba(255,255,255,.10); --s1:#3987e5; --s3:#199e70;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.4);
}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--plane);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
.wrap{width:100%;max-width:440px;text-align:center}
h1{font-size:24px;letter-spacing:-.02em;margin:0 0 4px}
.sub{color:var(--muted);font-size:14px;margin:0 0 26px}
.card{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;
  background:var(--surface);border:1px solid var(--border);border-radius:16px;
  padding:18px 18px;margin-bottom:14px;box-shadow:var(--shadow);
  transition:transform .12s ease, border-color .12s ease}
.card:hover{transform:translateY(-2px);border-color:var(--muted)}
.ico{width:46px;height:46px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:22px;color:#fff}
.i1{background:var(--s1)} .i2{background:var(--s3)}
.tx{text-align:left;flex:1}
.tx b{display:block;font-size:16px}
.tx span{font-size:12.5px;color:var(--muted)}
.arrow{color:var(--muted);font-size:20px}
.foot{margin-top:18px;font-size:11.5px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Finanzas</h1>
  <p class="sub">Regla 50 / 20 / 20 / 10 · en vivo</p>

  <a class="card" href="./mati.html">
    <span class="ico i1">📊</span>
    <span class="tx"><b>Mis Finanzas</b><span>Tablero de Mati</span></span>
    <span class="arrow">→</span>
  </a>

  <a class="card" href="./agos.html">
    <span class="ico i2">💰</span>
    <span class="tx"><b>Finanzas de Agos</b><span>Tablero de Agos</span></span>
    <span class="arrow">→</span>
  </a>

  <p class="foot">Cada tablero lee los datos en vivo desde su planilla de Google.</p>
</div>
</body>
</html>
